name: APEX-QUANT-OMNI SOVEREIGN v75.0 (XAUUSD Signal & 2-Way Bot)

on:
  schedule:
    # Runs every 15 minutes aligned with the 15M execution timeframe
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode (oneshot | commands_only)"
        required: true
        default: "oneshot"
        type: choice
        options:
          - oneshot
          - commands_only
      force_notify:
        description: "Force Telegram & Discord diagnostic report even if NEUTRAL/suppressed"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  actions: read

concurrency:
  group: apex-quant-omni-xauusd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quant-signal-engine:
    name: Run XAUUSD Quant Engine & Forensic Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Latest SQLite State Artifact (If Available)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow="signal_bot.yml" --status=success --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -n apex-quant-forensic-artifacts || true
          fi

      - name: Execute APEX-QUANT-OMNI Sovereign Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACCOUNT_BALANCE: "10000.0"
          RISK_PERCENT: "1.0"
          CONFLUENCE_THRESHOLD: "65"
          BOT_MODE: ${{ github.event.inputs.mode || 'oneshot' }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
          MPLBACKEND: "Agg"
        run: |
          python bot.py --mode "${BOT_MODE}"

      - name: Upload Forensic SQLite DB & Backtest Chart Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-quant-forensic-artifacts
          path: |
            trading_signals.db
            backtest_performance.png
          retention-days: 30
          if-no-files-found: warn
