name: 40

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-quant-omni
  cancel-in-progress: false

jobs:
  run-signal-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ACCOUNT_BALANCE: "10000"
      RISK_PERCENTAGE: "1.0"
      SQLITE_DB_PATH: "trading_signals.db"
      BACKTEST_CHART_PATH: "backtest_performance.png"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run APEX-QUANT-OMNI bot
        run: python main.py

      - name: Upload backtest chart artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-performance-${{ github.run_id }}
          path: |
            backtest_performance.png
            trading_signals.db
          if-no-files-found: warn
          retention-days: 14
