name: APEX-QUANT-OMNI ENTERPRISE v40.0

on:
  schedule:
    # Every 15 minutes (GitHub cron is UTC). Fires on the 15m execution grid.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_no_trade_alert:
        description: "Dispatch a NO-TRADE status report when confluence fails"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: apex-quant-omni-enterprise
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signal-engine:
    name: XAUUSD Signal Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify headless Matplotlib backend
        run: |
          python -c "import matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot as plt; print('Agg backend OK:', matplotlib.get_backend())"

      - name: Execute APEX-QUANT-OMNI engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE || '10000' }}
          RISK_PERCENTAGE: ${{ vars.RISK_PERCENTAGE || '1.0' }}
          SEND_NO_TRADE_ALERT: ${{ github.event.inputs.send_no_trade_alert || '0' }}
        run: python main.py

      - name: Upload backtest performance chart
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-performance-chart
          path: backtest_performance.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload SQLite forensic database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-signals-database
          path: trading_signals.db
          if-no-files-found: warn
          retention-days: 14

      - name: Upload engine logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-run-logs
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
